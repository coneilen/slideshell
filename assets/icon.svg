<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b11f4b"/>
      <stop offset="1" stop-color="#7a1535"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfbf8"/>
      <stop offset="1" stop-color="#f0ece4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- back slide (stacked deck hint) -->
  <g filter="url(#shadow)">
    <rect x="232" y="178" width="620" height="430" rx="28" ry="28"
          fill="#fcfbf8" opacity="0.55" transform="rotate(-4 542 393)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="208" y="208" width="620" height="430" rx="28" ry="28"
          fill="#fcfbf8" opacity="0.8" transform="rotate(-1.5 518 423)"/>
  </g>

  <!-- front slide -->
  <g filter="url(#shadow)">
    <rect x="192" y="232" width="640" height="448" rx="32" ry="32" fill="url(#slide)"/>
    <!-- eyebrow tag -->
    <rect x="232" y="280" width="120" height="22" rx="6" ry="6" fill="#b11f4b" opacity="0.85"/>
    <!-- title bar -->
    <rect x="232" y="324" width="440" height="34" rx="6" ry="6" fill="#242424"/>
    <rect x="232" y="372" width="360" height="22" rx="5" ry="5" fill="#5c5c5c" opacity="0.55"/>
    <!-- bullet rows -->
    <circle cx="244" cy="448" r="9" fill="#b11f4b"/>
    <rect x="268" y="438" width="320" height="20" rx="5" ry="5" fill="#5c5c5c" opacity="0.55"/>
    <circle cx="244" cy="492" r="9" fill="#b11f4b"/>
    <rect x="268" y="482" width="380" height="20" rx="5" ry="5" fill="#5c5c5c" opacity="0.55"/>
    <circle cx="244" cy="536" r="9" fill="#b11f4b"/>
    <rect x="268" y="526" width="260" height="20" rx="5" ry="5" fill="#5c5c5c" opacity="0.55"/>
    <!-- progress bar -->
    <rect x="232" y="624" width="560" height="6" rx="3" ry="3" fill="#dedede"/>
    <rect x="232" y="624" width="220" height="6" rx="3" ry="3" fill="#b11f4b"/>
  </g>

  <!-- terminal panel overlapping bottom-right -->
  <g filter="url(#shadow)">
    <rect x="468" y="608" width="416" height="232" rx="28" ry="28" fill="#1a1a1a"/>
    <!-- traffic lights -->
    <circle cx="508" cy="644" r="10" fill="#fb7185"/>
    <circle cx="540" cy="644" r="10" fill="#fbbf24"/>
    <circle cx="572" cy="644" r="10" fill="#4ade80"/>
    <!-- prompt chevron -->
    <path d="M 504 720 L 548 752 L 504 784" stroke="#fd8ea1" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- blinking cursor block -->
    <rect x="576" y="730" width="32" height="48" rx="4" ry="4" fill="#dedede"/>
  </g>
</svg>
